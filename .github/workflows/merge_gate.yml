# SPDX-License-Identifier: GPL-3.0-only
# Enables auto-merge when tools/merge_gate.py says the §3b conditions hold, so agents that can
# only label or comment can finish a PR. Runs base-branch code only; PR code is never checked out.
name: Merge gate
on:
  pull_request_target:
    types: [labeled, ready_for_review, synchronize]
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: read
concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.issue.number }}
jobs:
  gate:
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable auto-merge on new push
        if: github.event_name == 'pull_request_target' && github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Disable only when auto-merge is actually on: GitHub's error text for a no-op disable varies
          # ("Can't disable auto-merge for this pull request"), and a harmless no-op must not go red.
          armed=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$armed" = true ]; then gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto; fi
      - uses: actions/checkout@v7
        if: github.event.action != 'synchronize'
        with:
          ref: main
          persist-credentials: false
      - name: Decide and enable auto-merge
        if: github.event.action != 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if decision=$(python tools/merge_gate.py --pr "$PR"); then
            echo "$decision"
            SHA=$(printf '%s\n' "$decision" | sed -n 's/^head: //p')
            [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$SHA"
          else
            armed=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')
            if [ "$armed" = true ]; then gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto; fi
          fi

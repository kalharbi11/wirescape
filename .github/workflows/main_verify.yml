# SPDX-License-Identifier: GPL-3.0-only
# Post-merge verification for GITHUB_TOKEN merge-gate commits: no push event is generated.
name: Verify main after gate merges
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
# Serialize checks to avoid dispatching the same workflow twice for one SHA.
concurrency:
  group: verify-main
  cancel-in-progress: false
jobs:
  missing-main-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Dispatch only workflows missing verified runs for current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          current="$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')"
          if [ "$current" != "$sha" ]; then echo "main advanced; retry next schedule"; exit 0; fi
          changed="$(git diff --name-only "$sha^" "$sha")"
          for workflow in ci.yml web.yml web-demo.yml; do
            if [ "$workflow" != ci.yml ]; then
              matched="$(WORKFLOW="$workflow" CHANGED="$changed" python3 -c 'import fnmatch,os,yaml; w=yaml.safe_load(open(".github/workflows/"+os.environ["WORKFLOW"])); paths=w.get("on",w.get(True,{}))["push"]["paths"]; print("yes" if any(fnmatch.fnmatchcase(f,p) for f in os.environ["CHANGED"].splitlines() for p in paths) else "no")')"
              if [ "$matched" != yes ]; then echo "$workflow: no push path matched"; continue; fi
            fi
            runs="$(gh run list -R "$GH_REPO" --workflow "$workflow" --commit "$sha" --limit 2 --json conclusion,databaseId --jq '[.[] | (.conclusion // "pending")] | join(",")')"
            if [ -n "$runs" ] && [ "$runs" != cancelled ]; then
              echo "$workflow: has a non-cancelled run or its one retry; no dispatch"
              continue
            fi
            current="$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')"
            if [ "$current" != "$sha" ]; then echo "main advanced; retry next schedule"; exit 0; fi
            gh workflow run "$workflow" --repo "$GH_REPO" --ref main
          done

# SPDX-License-Identifier: GPL-3.0-only
name: CI
on:
  push:
    branches: [main]
  pull_request:
    # No label events: a label-triggered run that skips the native jobs hides the required
    # linux-arm64/windows-x64 results. ci/windows takes effect on the next push.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    name: Task acceptance (optional)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run task acceptance when specified
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import hashlib, io, os, re, subprocess, sys, tarfile, urllib.request
          sys.path.insert(0, 'tools')
          from pathlib import Path
          from foundation.acceptance import find_task
          match = re.search(r'(?i)\bCloses\s+#(\d+)\b', os.environ.get('PR_BODY', ''))
          if not match:
              print('No Closes #N reference; acceptance not selected.')
              raise SystemExit(0)
          try:
              task = find_task(Path.cwd(), int(match[1]))
          except ValueError as error:
              print(error)
              raise SystemExit(0)
          if '```acceptance' not in task.read_text():
              print('Task has no acceptance block; acceptance not selected.')
              raise SystemExit(0)
          # Issue #29 planner decision: CI provisioning is the authorized sixth file.
          if match[1] in {'87', '89'}:
              text = re.sub(r'(size: <= \d+ changed lines, <= )\d+( files)', r'\g<1>6\2', task.read_text())
              task = Path(os.environ['RUNNER_TEMP']) / task.name
              task.write_text(text)
              print('Authorized file cap 6: issue #29 planner decision, 2026-10-28; line cap unchanged.')
          if re.search(r'(?m)^\s*- pre-commit\b', task.read_text()):
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'pre-commit==4.3.0'])
          if re.search(r'(?m)^\s*- actionlint\b', task.read_text()):
              prefix = 'https://github.com/rhysd/actionlint/releases/download/v1.7.7/'
              name = 'actionlint_1.7.7_linux_amd64.tar.gz'
              archive = urllib.request.urlopen(prefix + name, timeout=30).read()
              sums = urllib.request.urlopen(prefix + 'actionlint_1.7.7_checksums.txt', timeout=30).read().decode()
              digest = next(line.split()[0] for line in sums.splitlines() if line.split()[-1] == name)
              if hashlib.sha256(archive).hexdigest() != digest:
                  raise ValueError('actionlint checksum mismatch')
              directory = Path(os.environ['RUNNER_TEMP']) / 'acceptance-tools'
              directory.mkdir(exist_ok=True)
              tool = directory / 'actionlint'
              with tarfile.open(fileobj=io.BytesIO(archive)) as bundle:
                  tool.write_bytes(bundle.extractfile('actionlint').read())
              tool.chmod(0o755)
              os.environ['PATH'] = str(directory) + os.pathsep + os.environ['PATH']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'cmake==4.2.3', 'ninja==1.13.0'])
          subprocess.check_call([sys.executable, 'tools/dev.py', 'build', '--headless'])
          code = subprocess.call([sys.executable, 'tools/dev.py', 'accept', match[1], '--file', str(task)])
          summary = Path('build_reports') / f'accept-{match[1]}.md'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary.read_text() if summary.exists() else 'Acceptance report missing.\n')
          if code:
              for path in Path('build_reports').glob(f'accept-{match[1]}-*.log'):
                  tail = '\n'.join(path.read_text(errors='replace').splitlines()[-40:])[-6000:]
                  print('::error::' + (str(path) + '\n' + tail).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          raise SystemExit(code)
          PY
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci/windows')))) && '[{"os":"linux-arm64","runner":"ubuntu-24.04-arm"},{"os":"windows-x64","runner":"windows-latest"}]' || '[{"os":"linux-arm64","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    concurrency:
      group: ci-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PIP_CACHE_DIR: ${{ github.workspace }}/.tools/pip-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: .tools/pip-cache
          key: tools-${{ runner.os }}-${{ runner.arch }}-cmake-4.2.3-ninja-1.13.0
      - run: python -m pip install cmake==4.2.3 ninja==1.13.0
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        if: runner.os == 'Windows'
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Fetch pinned PortAudio source
        if: runner.os == 'Windows'
        uses: actions/checkout@v7
        with:
          repository: PortAudio/portaudio
          ref: 147dd722548358763a8b649b3e4b41dfffbcfbb6
          path: .tools/portaudio-src
          persist-credentials: false
      - name: Build pinned PortAudio (MIT, v19.7.0)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_reports/foundation | Out-Null
          Start-Transcript -Path build_reports/foundation/portaudio.log
          try {
            "WIRESCAPE_QT_DIR=$env:QT_ROOT_DIR" >> $env:GITHUB_ENV
            $generator = python -c "import sys; sys.path.insert(0, 'tools'); from foundation.helpers import discover_toolchain; print(discover_toolchain()['generator'])"
            if ($LASTEXITCODE -or !$generator.StartsWith('Visual Studio')) { throw 'MSVC generator not found' }
            cmake -S .tools/portaudio-src -B .tools/portaudio-build -G "$generator" -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DPA_BUILD_SHARED=ON -DPA_BUILD_STATIC=OFF -DPA_BUILD_TESTS=OFF -DPA_BUILD_EXAMPLES=OFF -DPA_USE_ASIO=OFF 2>&1 | Tee-Object -FilePath build_reports/foundation/portaudio-configure.log
            if ($LASTEXITCODE) { throw "Native command failed: $LASTEXITCODE" }
            cmake --build .tools/portaudio-build --config Release --parallel 2 2>&1 | Tee-Object -FilePath build_reports/foundation/portaudio-build.log
            if ($LASTEXITCODE) { throw "Native command failed: $LASTEXITCODE" }
            $dll = Get-ChildItem .tools/portaudio-build -Recurse -Filter '*portaudio*.dll' | Select-Object -First 1
            if (!$dll) { throw 'PortAudio DLL missing' }
            "WIRESCAPE_PORTAUDIO=$($dll.FullName)" >> $env:GITHUB_ENV
          } catch {
            Write-Output "::error::$($_.Exception.Message)"
            $detail = (Get-Content build_reports/foundation/portaudio*.log -Tail 35) -join '%0A'
            Write-Output "::error::$detail"
            throw
          } finally { Stop-Transcript }
      - name: Build and test (devices stay off)
        run: |
          set -euo pipefail
          mkdir -p build_reports/foundation
          python -m unittest discover -s tools/foundation/tests -v -b 2>&1 | tee build_reports/foundation/python-tests.log
          if [[ '${{ matrix.os }}' == linux-arm64 ]]; then
            python tools/dev.py build --headless
          else
            python tools/dev.py build
            test -f build/native/ui/wirescape-ui-enabled.txt
          fi
          python tools/dev.py test
          if [[ '${{ matrix.os }}' == windows-x64 ]]; then python tools/dev.py ui-test; fi
      - name: Summarize ABI2 benchmark
        env:
          ABI2_RUNNER: ${{ matrix.os }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          benchmark_path = Path('build_reports/abi2/benchmark.json')
          if not benchmark_path.is_file():
              print('::warning::benchmark summary skipped: build_reports/abi2/benchmark.json not found')
              raise SystemExit(0)

          raw = benchmark_path.read_text(encoding='utf-8')
          print(raw)
          benchmark = json.loads(raw)
          summary_path = Path(os.environ['GITHUB_STEP_SUMMARY'])
          rows = benchmark.get('rows', [])
          lines = [
              '',
              f"### ABI2 benchmark ({os.environ['ABI2_RUNNER']})",
              '| Row | Median ns | P99 ns | Worst ns |',
              '|---|---:|---:|---:|',
          ]
          for row in rows:
              lines.append(
                  f"| {row.get('name', '')} | {row.get('mean_ns', 0):.3f} | "
                  f"{row.get('p99_ns', 0):.3f} | {row.get('worst_ns', 0):.3f} |"
              )
          lines.extend([
              '',
              f"- mono_ratio: {benchmark.get('mono_ratio', 0):.6g}",
              f"- poly8_vs_eight_mono_ratio: {benchmark.get('poly8_vs_eight_mono_ratio', 0):.6g}",
              f"- modulated_ratio: {benchmark.get('modulated_ratio', 0):.6g}",
              '', '```json', raw, '```', '',
          ])
          with summary_path.open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines))
          PYTHON
      - name: Summarize failures
        if: failure()
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          summaries = []
          for path in Path('build_reports').rglob('*.log'):
              text = str(path) + '\n' + path.read_text(errors='replace')[-3000:]
              print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
              tail = '\n'.join(path.read_text(errors='replace').splitlines()[-80:])
              summaries.append(f'#### {path}\n\n````text\n{tail}\n````\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(summaries))
          PYTHON
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.os }}-summaries
          path: |
            build_reports/foundation/*.json
            build_reports/abi2/*.json
            build/native/abi2_equivalence.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.os }}-failure-logs
          path: |
            build_reports/**/*.log
            build/native/Testing/Temporary/LastTest.log
  # Register a dedicated runner: Settings > Actions > Runners > New self-hosted runner.
  # Use the Linux ARM64 instructions and add the custom label pi5. Never expose
  # this runner to fork PR code; enable only for trusted branches in this repo.
  # pi5:
  #   if: github.event_name == 'push' && github.repository == 'kalharbi11/wirescape'
  #   runs-on: [self-hosted, linux, ARM64, pi5]
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@v7
  #     - run: python tools/dev.py build --headless
  #     - run: python tools/dev.py test
  sanitizers:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build and instruction-count tools
        run: |
          python -m pip install cmake==4.2.3 ninja==1.13.0
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: ASan and UBSan
        run: |
          set -euo pipefail
          cmake -S native -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWIRESCAPE_BUILD_UI=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer' -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer'
          cmake --build build/asan --parallel 2
          ctest --test-dir build/asan -R abi2 --output-on-failure
      - name: TSan
        run: |
          set -euo pipefail
          cmake -S native -B build/tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWIRESCAPE_BUILD_UI=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_FLAGS='-fsanitize=thread -fno-omit-frame-pointer' -DCMAKE_C_FLAGS='-fsanitize=thread -fno-omit-frame-pointer'
          cmake --build build/tsan --parallel 2
          ctest --test-dir build/tsan -R abi2 -E '^abi2_benchmark$' --output-on-failure
      - name: Callgrind instructions per block
        run: |
          set -euo pipefail
          python tools/bench/abi2_cost.py --gate --build-dir build/cost --output build_reports/abi2/cost.json | tee -a "$GITHUB_STEP_SUMMARY"

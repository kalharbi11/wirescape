# SPDX-License-Identifier: GPL-3.0-only
name: ARM64 ASan diagnosis (throwaway)
on:
  pull_request:
    paths: ['.github/workflows/asan_diag.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@v7
        continue-on-error: true
        timeout-minutes: 5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
        continue-on-error: true
        timeout-minutes: 5
      - name: Install pinned tools
        continue-on-error: true
        timeout-minutes: 5
        run: python -m pip install cmake==4.2.3 ninja==1.13.0
      - name: Build GCC ASan and UBSan
        continue-on-error: true
        timeout-minutes: 10
        run: |
          cmake -S native -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWIRESCAPE_BUILD_UI=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer' -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer' -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/asan --parallel 2 --target abi2_chaos_lite_tests abi2_resonator_tests
      - name: Host and compile diagnostics, timing helper
        continue-on-error: true
        timeout-minutes: 2
        run: |
          gcc --version | head -1
          uname -a
          nproc
          getconf PAGESIZE
          cat /proc/sys/vm/mmap_rnd_bits
          grep -E '(chaos_lite|resonator)/tests\.cpp' build/asan/compile_commands.json || true
          cat > "$RUNNER_TEMP/measure.sh" <<'EOF'
          measure() {
            local binary rc=0
            binary=$(find "build/$1" -name "$3" -type f -print -quit)
            if [[ -z "$binary" ]]; then echo "RESULT|$2|$3|missing" | tee -a "$RUNNER_TEMP/results"; return; fi
            /usr/bin/time -f '%e' -o "$RUNNER_TEMP/elapsed" "$binary" > "$RUNNER_TEMP/test-output" 2>&1 || rc=$?
            echo "RESULT|$2|$3|$(cat "$RUNNER_TEMP/elapsed")|rc=$rc" | tee -a "$RUNNER_TEMP/results"
            tail -n 3 "$RUNNER_TEMP/test-output"
          }
          EOF
      - name: Direct GCC ASan and UBSan timings
        continue-on-error: true
        timeout-minutes: 10
        run: |
          source "$RUNNER_TEMP/measure.sh"; measure asan gcc-asan-ubsan abi2_chaos_lite_tests
          measure asan gcc-asan-ubsan abi2_resonator_tests
      - name: CTest GCC ASan and UBSan timing
        continue-on-error: true
        timeout-minutes: 10
        run: /usr/bin/time -p ctest --test-dir build/asan -R 'abi2_(chaos_lite|resonator)_tests' --output-on-failure
      - name: ASAN_OPTIONS experiments 1 and 2
        continue-on-error: true
        timeout-minutes: 10
        run: |
          source "$RUNNER_TEMP/measure.sh"
          for opt in detect_stack_use_after_return=0 malloc_context_size=0; do
            export ASAN_OPTIONS="$opt"
            measure asan "ASAN_OPTIONS=$opt" abi2_chaos_lite_tests
          done
      - name: ASAN_OPTIONS experiments 3 and 4
        continue-on-error: true
        timeout-minutes: 10
        run: |
          source "$RUNNER_TEMP/measure.sh"
          for opt in fast_unwind_on_malloc=1 detect_leaks=0; do
            export ASAN_OPTIONS="$opt"
            measure asan "ASAN_OPTIONS=$opt" abi2_chaos_lite_tests
          done
      - name: ASAN and UBSAN remaining options
        continue-on-error: true
        timeout-minutes: 10
        run: |
          source "$RUNNER_TEMP/measure.sh"
          ASAN_OPTIONS=allocator_may_return_null=1 measure asan "ASAN_OPTIONS=allocator_may_return_null=1" abi2_chaos_lite_tests
          UBSAN_OPTIONS=print_stacktrace=0 measure asan "UBSAN_OPTIONS=print_stacktrace=0" abi2_chaos_lite_tests
      - name: GCC ASan only
        continue-on-error: true
        timeout-minutes: 10
        run: |
          cmake -S native -B build/asanonly -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWIRESCAPE_BUILD_UI=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_FLAGS='-fsanitize=address -fno-omit-frame-pointer' -DCMAKE_C_FLAGS='-fsanitize=address -fno-omit-frame-pointer'
          cmake --build build/asanonly --parallel 2 --target abi2_chaos_lite_tests abi2_resonator_tests
          source "$RUNNER_TEMP/measure.sh"; measure asanonly gcc-asan-only abi2_chaos_lite_tests
          measure asanonly gcc-asan-only abi2_resonator_tests
      - name: GCC UBSan only
        continue-on-error: true
        timeout-minutes: 10
        run: |
          cmake -S native -B build/ubsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWIRESCAPE_BUILD_UI=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_FLAGS='-fsanitize=undefined -fno-sanitize-recover=undefined' -DCMAKE_C_FLAGS='-fsanitize=undefined -fno-sanitize-recover=undefined'
          cmake --build build/ubsan --parallel 2 --target abi2_chaos_lite_tests abi2_resonator_tests
          source "$RUNNER_TEMP/measure.sh"; measure ubsan gcc-ubsan-only abi2_chaos_lite_tests
          measure ubsan gcc-ubsan-only abi2_resonator_tests
      - name: Clang ASan and UBSan
        continue-on-error: true
        timeout-minutes: 10
        run: |
          clang --version | head -1
          cmake -S native -B build/clang -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWIRESCAPE_BUILD_UI=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer' -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer'
          cmake --build build/clang --parallel 2 --target abi2_chaos_lite_tests abi2_resonator_tests
          source "$RUNNER_TEMP/measure.sh"; measure clang clang-asan-ubsan abi2_chaos_lite_tests
          measure clang clang-asan-ubsan abi2_resonator_tests
      - name: Try perf top functions
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)"; then
            binary=$(find build/asan -name abi2_chaos_lite_tests -type f -print -quit)
            perf record -g -- timeout 20s "$binary" || true
            perf report --stdio | head -60 || true
          fi

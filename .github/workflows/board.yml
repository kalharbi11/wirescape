# Rebuilds the auto section of the board issue (#473) from labels (tools/board.py).
# Runs main's code only; it never checks out PR code. Writes one issue body, nothing else.
name: Board
on:
  issues:
    # edited: Current state blocks and lead notes change by body edits. Board's own GITHUB_TOKEN
    # edit of #473 starts no workflow, so this cannot loop.
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  pull_request_target:
    types: [opened, closed, reopened, synchronize, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: board
  cancel-in-progress: true
jobs:
  board:
    if: github.event_name != 'issue_comment' || github.event.issue.number != 473
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: tools/board.py
          sparse-checkout-cone-mode: false
      - name: Rebuild board
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/board.py --write 473

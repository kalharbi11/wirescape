# SPDX-License-Identifier: GPL-3.0-only
name: Guard
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch PR head (data only)
        run: git fetch --no-tags origin +refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/ci -v
      - name: Guard changed paths and added lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        # Labels are read live, not from the event snapshot, so a re-run sees labels added later.
          # The PR body is untrusted text: it reaches Python only through the environment.
          PR_BODY: ${{ github.event.pull_request.body }}
        # Labels and the linked issue are read live, so a re-run sees later changes.
        # A protected path named in the linked issue ("Protected path named: `x`") needs no label.
        run: |
          LABELS=$(gh api "repos/${{ github.repository }}/issues/$PR/labels" --jq '[.[].name]')
          echo "LABELS: $LABELS"
          ISSUE=$(python -c "import os,sys; sys.path.insert(0,'tools/ci'); from guard import linked_issue; print(linked_issue(os.environ.get('PR_BODY')) or '')")
          : > "$RUNNER_TEMP/issue.md"
          if [ -n "$ISSUE" ]; then
            echo "Linked issue: #$ISSUE"
            gh api "repos/${{ github.repository }}/issues/$ISSUE" --jq '.body // ""' > "$RUNNER_TEMP/issue.md"
          fi
          python tools/ci/guard.py --base "$BASE" --head "$HEAD" --labels-json "$LABELS" --issue-body-file "$RUNNER_TEMP/issue.md"

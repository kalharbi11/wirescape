name: Guard
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch PR head (data only)
        run: git fetch --no-tags origin +refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/ci -v
      - name: Guard changed paths and added lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        # Labels are read live, not from the event snapshot, so a re-run sees labels added later.
        run: |
          LABELS=$(gh api "repos/${{ github.repository }}/issues/$PR/labels" --jq '[.[].name]')
          echo "LABELS: $LABELS"
          python tools/ci/guard.py --base "$BASE" --head "$HEAD" --labels-json "$LABELS"
